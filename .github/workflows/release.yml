# Release asset naming contract
# -------------------------------
# This workflow is a public contract with the `rat-nest` npm wrapper
# (rat-nest/src/releaseUrl.js), which downloads these exact assets from
# GitHub Releases at install time. Do not rename, restructure, or re-encode
# anything here without updating that module in lockstep.
#
#   Archive filename : rat-<platform>-<arch>.<ext>
#     No version in the filename - it's implied by the release tag itself,
#     and rat-nest's own package.json version is hard-locked to that tag
#     (see the `publish-npm` job below), so there's nothing to disambiguate.
#     <platform>/<arch> = Node.js `process.platform` / `process.arch` values,
#                         NOT Rust target triples:
#                           linux  / x64    (x86_64-unknown-linux-gnu)
#                           linux  / arm64  (aarch64-unknown-linux-gnu)
#                           darwin / x64    (x86_64-apple-darwin)
#                           darwin / arm64  (aarch64-apple-darwin)
#                           win32  / x64    (x86_64-pc-windows-msvc)
#     <ext> = tar.gz for linux/darwin, zip for win32
#
#   Binary inside the archive : always named `rat` (`rat.exe` on win32),
#   with no version/platform suffix.
#
#   Also uploaded : a single SHA256SUMS file (standard `sha256sum` format,
#   one "<hash>  <filename>" line per archive) covering all archives.
#   rat-nest verifies every download against this before trusting it.
#
# Releases are only ever cut from the `release` branch - the `guard` job
# below enforces that a pushed tag actually points at a commit reachable
# from `release` before anything builds.

name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Verify tag is on release branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm tag is reachable from release
        run: |
          git fetch origin release:refs/remotes/origin/release
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/release; then
            echo "::error::${{ github.ref_name }} points at a commit that is not on the release branch. Releases must be cut from release."
            exit 1
          fi

  version:
    name: Resolve version
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Textual edits only - no `cargo` invocation here - so this can't
      # accidentally re-resolve (and drift) any dependency version. Both
      # patterns are anchored so they can only ever touch the root
      # package's own version line, never a dependency's.
      - name: Stamp version into Cargo.toml and Cargo.lock
        working-directory: rat
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          sed -i "0,/^version = \".*\"\$/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rat\"\$/{n;s/^version = \".*\"\$/version = \"$VERSION\"/}" Cargo.lock

      - name: Upload versioned Cargo files
        uses: actions/upload-artifact@v4
        with:
          name: versioned-cargo-files
          path: |
            rat/Cargo.toml
            rat/Cargo.lock
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - platform: darwin
            arch: x64
            target: x86_64-apple-darwin
            os: macos-latest
          - platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Overlay release-versioned Cargo files
        uses: actions/download-artifact@v4
        with:
          name: versioned-cargo-files
          path: rat

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rat -> target
          key: ${{ matrix.target }}

      # aarch64-unknown-linux-gnu is the one leg that can't build natively on
      # an x86_64 ubuntu-latest runner. The crate has no C dependencies, so a
      # plain apt-installed cross gcc/binutils toolchain is enough - no need
      # for `cross` (Docker) or `cargo zigbuild` here.
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        working-directory: rat
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (unix)
        if: matrix.platform != 'win32'
        working-directory: rat
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rat
          else
            strip target/${{ matrix.target }}/release/rat
          fi

      - name: Package archive (unix)
        if: matrix.platform != 'win32'
        shell: bash
        working-directory: rat
        run: |
          staging="rat-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/rat" "$staging/rat"
          tar czf "$staging.tar.gz" -C "$staging" rat
          echo "asset=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (windows)
        if: matrix.platform == 'win32'
        shell: pwsh
        working-directory: rat
        run: |
          $staging = "rat-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rat.exe" "$staging/rat.exe"
          Compress-Archive -Path "$staging/rat.exe" -DestinationPath "$staging.zip"
          echo "asset=$staging.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.asset }}
          path: rat/${{ env.asset }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rat-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          files: dist/*

  publish-npm:
    name: Publish npm package
    needs: [release, version]
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set package version to match release
        working-directory: rat-nest
        run: npm version "${{ needs.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: rat-nest
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
